<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Chatfolio">
  <defs>
    <linearGradient id="cf-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="0.5" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#0B4FC4"/>
    </linearGradient>
    <radialGradient id="cf-glow" cx="0.2" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#cf-tile)"/>
  <rect width="128" height="128" rx="30" fill="url(#cf-glow)"/>
  <!-- folio: the stacked page behind the conversation -->
  <rect x="46" y="24" width="60" height="60" rx="15" fill="#A9CEFF"/>
  <!-- the chat bubble -->
  <path d="M46 38 H82 A16 16 0 0 1 98 54 V74 A16 16 0 0 1 82 90 H62 L44 104 L44 90 A14 14 0 0 1 30 76 V54 A16 16 0 0 1 46 38 Z" fill="#FFFFFF"/>
