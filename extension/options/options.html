<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 560px;
      margin: 3rem auto;
      padding: 0 1rem;
      font-size: 14px;
    }
    label { display: block; margin: 1rem 0 0.3rem; color: #555; }
    select, button { padding: 7px 10px; border-radius: 6px; border: 1px solid #ccc; }
    button { margin-top: 1.2rem; background: #1a73e8; color: #fff; border: none; cursor: pointer; }
    #saved { color: #188038; margin-left: 10px; }
    h2 { font-size: 17px; }
    ul { color: #666; line-height: 1.8; }
  </style>
</head>
<body>
  <h2>Chatfolio — Settings</h2>

  <label for="defaultFormat">Default export format</label>
  <select id="defaultFormat">
    <option value="markdown">Markdown</option>
    <option value="html">HTML</option>
    <option value="json">JSON</option>
    <option value="text">Plain text</option>
  </select>

  <label for="latexStyle">LaTeX delimiters (markdown export)</label>
  <select id="latexStyle">
    <option value="obsidian">Obsidian style — $...$ / $$...$$</option>
    <option value="plain">Plain LaTeX — \\(...\\) / \\[...\\]</option>
  </select>

  <label for="embeddedComponents">Embedded artifact components (e.g. &lt;box gap={2}&gt;)</label>
  <select id="embeddedComponents">
    <option value="strip">Strip (remove)</option>
    <option value="codeblock">Keep as code block</option>
  </select>

  <button id="save">Save</button><span id="saved"></span>

  <h3>Roadmap (TODO)</h3>
  <ul>
    <li>Per-site adapter settings &amp; selector overrides</li>
    <li>Batch export via official site APIs</li>
    <li>PDF / image / docx / Notion output</li>
    <li>Filename &amp; metadata templates</li>
  </ul>

  <script src="options.js"></script>
</body>
</html>
